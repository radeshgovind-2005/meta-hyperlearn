<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HyperLearn — Share course</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A5CFF}a:hover{color:#0047CC}
</style>
</helmet>
<div style="width: 760px; height: 640px; box-sizing: border-box; padding: 40px; background: #5F6B76; font-family: Figtree, 'Helvetica Neue', Arial, sans-serif; color: #1C2B33; display: flex; align-items: center; justify-content: center">
  <section role="dialog" aria-label="Share Linear Algebra" style="width: 100%; max-width: 560px; background: #FFFFFF; border-radius: 12px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
      <h2 style="margin: 0; font-size: 20px; font-weight: 600">Share Linear Algebra</h2>
      <button type="button" aria-label="Close" style="width: 36px; height: 36px; border-radius: 8px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C2B33" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="invite" style="font-size: 14px; font-weight: 500">Invite by email</label>
      <div style="display: flex; gap: 8px">
        <input id="invite" type="email" placeholder="ana@university.edu" style="flex: 1; min-width: 0; height: 40px; border-radius: 8px; border: 1px solid #D4D9DE; padding: 0 12px; font: 400 14px Figtree, sans-serif; color: #1C2B33">
        <button type="button" style="height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: #0A5CFF; color: #FFFFFF; font: 600 14px Figtree, sans-serif; cursor: pointer">Invite</button>
      </div>
    </div>

    <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 0">
      <legend style="font-size: 14px; font-weight: 500; margin-bottom: 8px">What they get</legend>
      <label style="display: flex; gap: 12px; padding: 14px 0; border-top: 1px solid #E3E6EA; cursor: pointer">
        <input type="radio" name="mode" checked style="accent-color: #0A5CFF; width: 18px; height: 18px; margin: 2px 0 0">
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Follow your course</span><span style="font-size: 13px; line-height: 1.5; color: #5B6B7A">Your edits reach them automatically. Their progress and notes stay private.</span></span>
      </label>
      <label style="display: flex; gap: 12px; padding: 14px 0; border-top: 1px solid #E3E6EA; border-bottom: 1px solid #E3E6EA; cursor: pointer">
        <input type="radio" name="mode" style="accent-color: #0A5CFF; width: 18px; height: 18px; margin: 2px 0 0">
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Make their own copy</span><span style="font-size: 13px; line-height: 1.5; color: #5B6B7A">It adapts to them. They can still pull your updates later.</span></span>
      </label>
    </fieldset>

    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D4D9DE; background: #FFFFFF; font: 500 14px Figtree, sans-serif; color: #1C2B33; cursor: pointer">Copy link</button>
      <span style="font-size: 13px; color: #5B6B7A">They use their own API key for AI features.</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":640}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
